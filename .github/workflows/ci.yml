name: CI — verify and publish image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/muhamed201/devops-ci-app
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t "devops-ci-app:$GITHUB_SHA" .
      - name: Smoke test
        run: bash scripts/smoke.sh "devops-ci-app:$GITHUB_SHA"
      - name: Tag registry image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "devops-ci-app:$GITHUB_SHA" "$IMAGE_NAME:$GITHUB_SHA"
          docker tag "devops-ci-app:$GITHUB_SHA" "$IMAGE_NAME:latest"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    env:
      VM_HOST: 192.168.56.101
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy with Ansible
        working-directory: ansible
        run: ansible-playbook site.yml -e "app_tag=$GITHUB_SHA"
      - name: Check through Nginx
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-connrefused \
            --connect-timeout 3 --max-time 10 "http://$VM_HOST/health"

